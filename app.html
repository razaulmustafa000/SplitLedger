/* ===== motion ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1)}
#main.in-r>*{animation:inR .34s var(--ease) both}
#main.in-l>*{animation:inL .34s var(--ease) both}
#main.in-f>*{animation:inF .3s var(--ease) both}
#main.in-s>*:not(.hd):not(.seg):not(.chips):not(input){animation:inF .26s var(--ease) both}
#main.in-r>*:nth-child(2),#main.in-l>*:nth-child(2),#main.in-f>*:nth-child(2),#main.in-s>*:nth-child(2){animation-delay:.03s}
#main.in-r>*:nth-child(3),#main.in-l>*:nth-child(3),#main.in-f>*:nth-child(3),#main.in-s>*:nth-child(3){animation-delay:.06s}
#main.in-r>*:nth-child(n+4),#main.in-l>*:nth-child(n+4),#main.in-f>*:nth-child(n+4),#main.in-s>*:nth-child(n+4){animation-delay:.09s}
@keyframes inR{from{opacity:0;transform:translateX(24px)}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
#ov{display:flex;visibility:hidden;opacity:0;transition:opacity .28s var(--ease),visibility 0s linear .34s}
#ov.show{visibility:visible;opacity:1;transition:opacity .28s var(--ease),visibility 0s}
.sh{animation:none;transform:translateY(105%);transition:transform .34s var(--ease)}
#ov.show .sh{transform:none}
.sh.swp>*:not(h3){animation:inF .24s var(--ease) both}
.nb{transition:background-color .3s var(--ease),color .3s var(--ease),padding .34s var(--ease),gap .34s var(--ease);gap:0}
.nb span{display:inline-block!important;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .34s var(--ease),opacity .22s var(--ease)}
.nb.on{gap:6px}
.nb.on span{max-width:110px;opacity:1}
[data-v=glass] .nb.on span{max-width:0;opacity:0}
[data-v=glass] .nb.on::before{animation:inF .3s var(--ease)}
#ts{transition:opacity .25s var(--ease),transform .25s var(--ease);transform:translate(-50%,-6px)}
#ts.show{transform:translate(-50%,0)}
.sc,.chip,.btn,.opt,.fld,.ib,.mini,.li{transition:transform .15s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease)}
.sc:active,.chip:active,.btn:active,.opt:active,.fld:active,.ib:active,.mini:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){#main>*,.sh.swp>*{animation:none!important}#ov,.sh,.nb,.nb span,#ts{transition:none!important}}

/* ----- money logic -----

function shareText(s) {

/* ===== v2.8: month report, month-end reminder, live clock =====
   The report is the open hisab as it stands: every expense and payment, each person's balance, and who pays whom.
   Exporting it (or the expenses CSV) is written to the activity log as "Exported the month report"; the reminder
   stops for that person, and the month-end email (Code.gs, 11 pm on the last day) skips them. Nothing else changes. */
function repCSV() {
  const c = calc(), r = Math.round, q = qc, L = [];
  const who = e => { const P = parts(e, c.M); return P.length >= c.n ? 'Everyone (' + c.n + ')' : P.map(k => N(k)).join(' + '); };
  L.push(['SplitLedger month report'].map(q).join(','));
  L.push(['Month', liveMonth()].map(q).join(','), ['Open hisab', periodName()].map(q).join(','), ['Made on', new Date().toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })].map(q).join(','));
  L.push(['Room total', r(c.tot)].map(q).join(','), ['Expenses', c.count].map(q).join(','), ['Members sharing', c.n].map(q).join(','), '');
  L.push(q('Expenses'), ['Date', 'Paid by', 'Category', 'Description', 'Amount', 'Shared by'].map(q).join(','));
  D.ex.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0) || a.id - b.id).forEach(e => L.push([dlab(e, 1), N(e.by), e.cc || e.cat, e.d || '', e.amt, counted(e) ? who(e) : 'Not counted (payer paused or left)'].map(q).join(',')));
  L.push('', q('Payments'), ['Date', 'From', 'To', 'Amount'].map(q).join(','));
  D.pay.slice().sort((a, b) => a.id - b.id).forEach(p => L.push([p.ts ? dlab(p, 1) : '', N(p.f), N(p.t), p.a].map(q).join(',')));
  L.push('', q('Balances'), ['Member', 'Paid', 'Share', 'Payments sent', 'Payments received', 'Net (+ gets back, - owes)'].map(q).join(','));
  c.M.forEach(k => L.push([N(k), r(c.paid[k]), r(c.share[k]), r(c.sent[k]), r(c.recv[k]), r(c.net[k])].map(q).join(',')));
  L.push('', q('To settle'), ['Who pays', 'To whom', 'Amount'].map(q).join(','));
  const t = moves(c); t.forEach(([f, o, m]) => L.push([N(f), N(o), r(m)].map(q).join(',')));
  if (!t.length) L.push(q('Everyone is settled up'));
  return L.join('\n');
}

function jwt(t) { try { const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4))))); } catch (e) { return null; } }

var _tokP = null;
function token(force) {
  const a = V.auth;
  if (!a) return Promise.reject(new Error('Signed out'));
  if (!force && a.exp - Date.now() > 300000) return Promise.resolve(a.id);
  if (_tokP) return _tokP;
  _tokP = fetch(TOKURL + '?key=' + encodeURIComponent(V.cfg.apiKey), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.rt) })
    .then(r => r.json().catch(() => ({})).then(j => {
      if (!r.ok) {
        const m = (j.error && j.error.message) || '';
        if (/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN|INVALID_GRANT_TYPE|MISSING_REFRESH_TOKEN/.test(m)) signOutLocal('Your session ended. Please sign in again');
        throw new Error('Could not refresh the sign-in');
      }
      if (!V.auth) throw new Error('Signed out');
      const was = V.auth.rt; V.auth.id = j.id_token; V.auth.rt = j.refresh_token || V.auth.rt; V.auth.exp = Date.now() + (+j.expires_in || 3600) * 1000; saveLocal();
      if (was != V.auth.rt) natAuth();
      return j.id_token;
    }), () => { throw new Error('No internet'); })
    .finally(() => { _tokP = null; });
  return _tokP;
}
const dbu = () => V.cfg.databaseURL.replace(/\/+$/, '');
/* REST call to the database; throws Error with .code 'denied' | 'net' | 'http' */
function rest(path, method, body, retried) {
  return token().then(t => fetch(dbu() + path + '.json?auth=' + encodeURIComponent(t), method ? { method, body: body === undefined ? undefined : JSON.stringify(body) } : {}))
    .then(r => r.text().then(txt => {
      if (r.ok) { try { return JSON.parse(txt); } catch (e) { return null; } }
      if (r.status == 401 && /expired/i.test(txt) && !retried) return token(true).then(() => rest(path, method, body, 1));
      const e = new Error(r.status == 401 || r.status == 403 ? 'Not allowed by the server' : 'Server error ' + r.status); e.code = r.status == 401 || r.status == 403 ? 'denied' : 'http'; throw e;
    }), e => { if (e.code) throw e; const x = new Error(e.message == 'Signed out' ? 'Signed out' : 'No internet connection'); x.code = 'net'; throw x; });
}

/* ===================== LIVE DATA SYNC ===================== */
var SY = { es: null, S: null, st: 'conn', busy: 0, fail: 0, t: 0, on: {}, hb: 0, err: '' };
const dataUrl = () => dbu() + '/data';
function saveS() { try { localStorage.setItem('sl_s', JSON.stringify(SY.S)); } catch (e) { } }
function prune(v) {
  if (Array.isArray(v)) { const a = v.map(prune).filter(x => x !== undefined); return a.length ? a : undefined; }
  if (v && typeof v == 'object') { const o = {}; for (const k in v) { if (k[0] == '_') continue; const x = prune(v[k]); if (x !== undefined) o[k] = x; } return Object.keys(o).length ? o : undefined; }
  return (v === null || v === undefined || v === '' || (typeof v == 'number' && !isFinite(v))) ? undefined : v;
}
function cs(v) {
  if (v === null || v === undefined || typeof v != 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(cs).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + cs(v[k])).join(',') + '}';
}
function toTree(d) {
  const t = { meta: prune({ sm: d.sm, bud: d.bud, ba: d.ba, wifi: d.wifi }) || {} };
  COLS.forEach(k => { const o = {}; d[k].forEach(x => { const p = prune(x); if (p) o[x.id] = p; }); t[k] = o; });
  return t;
}
function fromTree(T) {
  const vals = o => arr(o).filter(x => x && typeof x == 'object');
  const m = (T && T.meta) || {}, o = { sm: m.sm, bud: m.bud, ba: m.ba || 0, wifi: m.wifi || '' };
  COLS.forEach(k => o[k] = vals(T && T[k]).sort((a, b) => a.id - b.id));
  return migrate(o);
}
const kids = o => Array.isArray(o) ? Object.assign({}, o) : (o || {});
function diff(L, S) {
  const u = {}, A = adm();
  ['meta', ...COLS].forEach(tk => {
    if (!A && tk == 'hist') return;
    const a = kids(L[tk]), b = kids(S && S[tk]);
    new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k => {
      if (!A && tk == 'meta' && k != 'ba') return;
      const x = a[k], y = b[k];
      if (x == null && y == null) return;
      if (!A && x == null) return;
      if (cs(x) != cs(y)) u[tk + '/' + k] = x == null ? null : x;
    });
  });
  return u;
}
function setAt(root, path, val) {
  const p = String(path).split('/').filter(Boolean);
  if (!p.length) return val == null ? {} : val;
  if (!root || typeof root != 'object') root = {};
  let o = root;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] != 'object') o[p[i]] = {}; o = o[p[i]]; }
  if (val == null) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = val;
  return root;
}
const clone = o => JSON.parse(JSON.stringify(o || {}));
function setSt(s) { if (s) SY.st = s; topR(); if ($('#ov').classList.contains('show') && stab == 's' && $('#acctbox')) settings(); }
function onEvent(type, e) {
  let msg; try { msg = JSON.parse(e.data); } catch (x) { return; }
  if (!msg || typeof msg.path != 'string') return;
  const pend = SY.S ? diff(toTree(D), SY.S) : {};
  if (!SY.S) SY.S = {};
  if (type == 'put') SY.S = setAt(SY.S, msg.path, msg.data);
  else if (msg.data && typeof msg.data == 'object') for (const k in msg.data) SY.S = setAt(SY.S, msg.path + '/' + k, msg.data[k]);
  if (!SY.S || typeof SY.S != 'object') SY.S = {};
  const T = clone(SY.S);
  for (const k in pend) setAt(T, k, pend[k]);
  const before = cs(toTree(D));
  D = fromTree(T); SY.on = SY.S.on || {};
  saveS(); saveLocal();
  if (SY.st != 'sync') SY.st = 'live';
  SY.fail = 0;
  if (cs(toTree(D)) != before) soft(); else topR();
  newNotes();
  if (Object.keys(pend).length || adm()) qflush();
}
function connect() {
  stopData();
  if (DEMO || !V.auth || !approved()) return;
  setSt('conn');
  token().then(t => {
    if (!approved() || !V.auth) return;
    const es = new EventSource(dataUrl() + '.json?auth=' + encodeURIComponent(t));
    SY.es = es;
    es.addEventListener('put', e => onEvent('put', e));
    es.addEventListener('patch', e => onEvent('patch', e));
    es.addEventListener('auth_revoked', () => { token(true).then(connect).catch(() => { SY.err = 'Sign-in needs refreshing. Check the internet.'; setSt('err'); }); });
    es.addEventListener('cancel', () => { stopData(); SY.err = 'The server stopped sharing the ledger with this account.'; setSt('err'); checkMember(); });
    es.onerror = () => { if (SY.es === es) { SY.err = navigator.onLine === false ? 'No internet. Changes are saved and will sync later.' : 'Reconnecting.'; setSt(navigator.onLine === false ? 'err' : 'conn'); } };
    if (!SY.S) SY.S = null;
    beat(); clearInterval(SY.hb); SY.hb = setInterval(beat, 60000);
    qflush();

}
function stopData() { if (SY.es) { try { SY.es.close(); } catch (e) { } } SY.es = null; clearInterval(SY.hb); clearTimeout(SY.t); }
function qflush() { if (DEMO || !approved() || !V.auth) return; clearTimeout(SY.t); SY.t = setTimeout(flush, 400); }
function flush() {
  clearTimeout(SY.t);

  const u = diff(toTree(D), SY.S);
  if (!adm()) {                                         // members: anything the server would refuse snaps back
    const T = clone(SY.S); for (const k in u) setAt(T, k, u[k]);
    const nd = fromTree(T);
    if (cs(toTree(nd)) != cs(toTree(D))) { D = nd; saveLocal(); soft(); }
  }
  if (!Object.keys(u).length || cs(u) === SY.block) { if (SY.st == 'sync') setSt(SY.es ? 'live' : 'conn'); return; }
  SY.block = '';
  SY.busy = 1; setSt('sync');
  const who = ME.email;
  rest('/data', 'PATCH', u).then(() => {
    SY.busy = 0; if (who != ME.email) return;
    for (const k in u) SY.S = setAt(SY.S, k, u[k]);
    saveS(); SY.fail = 0; SY.st = 'live'; flush(); topR();
  }).catch(err => {
    SY.busy = 0;
    if (err.code == 'denied') {                         // the server refused: drop the local change
      SY.block = cs(u); D = fromTree(clone(SY.S)); saveLocal(); render(); setSt(SY.es ? 'live' : 'conn');
      return toast('That change was not allowed by the server');
    }
    SY.fail++; SY.err = 'Could not reach the server. Changes are saved on this phone and will sync later.';
    setSt('err'); SY.t = setTimeout(flush, Math.min(60000, 3000 * SY.fail));
