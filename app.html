/* ===== motion ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1)}
#main.in-r>*{animation:inR .34s var(--ease) both}
#main.in-l>*{animation:inL .34s var(--ease) both}
#main.in-f>*{animation:inF .3s var(--ease) both}
#main.in-s>*:not(.hd):not(.seg):not(.chips):not(input){animation:inF .26s var(--ease) both}
#main.in-r>*:nth-child(2),#main.in-l>*:nth-child(2),#main.in-f>*:nth-child(2),#main.in-s>*:nth-child(2){animation-delay:.03s}
#main.in-r>*:nth-child(3),#main.in-l>*:nth-child(3),#main.in-f>*:nth-child(3),#main.in-s>*:nth-child(3){animation-delay:.06s}
#main.in-r>*:nth-child(n+4),#main.in-l>*:nth-child(n+4),#main.in-f>*:nth-child(n+4),#main.in-s>*:nth-child(n+4){animation-delay:.09s}
@keyframes inR{from{opacity:0;transform:translateX(24px)}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
#ov{display:flex;visibility:hidden;opacity:0;transition:opacity .28s var(--ease),visibility 0s linear .34s}
#ov.show{visibility:visible;opacity:1;transition:opacity .28s var(--ease),visibility 0s}
.sh{animation:none;transform:translateY(105%);transition:transform .34s var(--ease)}
#ov.show .sh{transform:none}
.sh.swp>*:not(h3){animation:inF .24s var(--ease) both}
.nb{transition:background-color .3s var(--ease),color .3s var(--ease),padding .34s var(--ease),gap .34s var(--ease);gap:0}
.nb span{display:inline-block!important;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .34s var(--ease),opacity .22s var(--ease)}
.nb.on{gap:6px}
.nb.on span{max-width:110px;opacity:1}
[data-v=glass] .nb.on span{max-width:0;opacity:0}
[data-v=glass] .nb.on::before{animation:inF .3s var(--ease)}
#ts{transition:opacity .25s var(--ease),transform .25s var(--ease);transform:translate(-50%,-6px)}
#ts.show{transform:translate(-50%,0)}
.sc,.chip,.btn,.opt,.fld,.ib,.mini,.li{transition:transform .15s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease)}
.sc:active,.chip:active,.btn:active,.opt:active,.fld:active,.ib:active,.mini:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){#main>*,.sh.swp>*{animation:none!important}#ov,.sh,.nb,.nb span,#ts{transition:none!important}}

${c.heldN ? `<div class="note">${c.heldN} expense${c.heldN > 1 ? 's' : ''} (${fm(c.held)}) paid by paused or former members ${c.heldN > 1 ? 'are' : 'is'} not counted.</div>` : ''}`);
}

/* ===== Ledger ===== */
function acts(e) { return adm() ? `<div class="ac"><button onclick="edit(${e.id})" aria-label="Edit">${ic('edit')}</button><button onclick="del(${e.id})" aria-label="Delete">${ic('trash')}</button></div>` : ''; }
const title = e => esc(e.d || e.cc || e.cat);
function grow(e, c) {
  const z = !counted(e), who = e.by == me() ? 'You' : esc(S1(e.by));
  return `<div class="li gl${z ? ' ps' : ''}"><div class="r1"><div class="ci">${ic(CI[e.cat])}</div><b class="tt">${title(e)}</b><div class="rg"><b>${fm(e.amt)}</b>${acts(e)}</div></div><div class="r2"><div><small>Paid by · ${dlab(e)}</small><div class="ab">${av(e.by, 20)}${who}</div></div><div><small>Each share</small><div class="ab">${z ? 'Not counted' : fm(e.amt / (c.n || 1))}</div></div></div></div>`;
}
function row(e, c) {

}
function ledger() {
  const c = calc();
  const L = D.ex.slice().sort((x, y) => (y.ts || 0) - (x.ts || 0) || y.id - x.id).filter(e => (cf == 'all' || e.cat == cf) && (!pf || e.by == pf) && (!qs || [e.d, e.cc, e.cat].join(' ').toLowerCase().includes(qs)));
  const PS = (V.vw == 'g' || innerHeight < 760) ? 3 : 4, n = Math.max(1, Math.ceil(L.length / PS));

}
function sq(el) { qs = el.value.toLowerCase().trim(); pg = 0; render(); const i = $('#qs'); i.focus(); const l = i.value.length; i.setSelectionRange(l, l); }
const getE = id => D.ex.find(x => x.id == id);
function gone() { toast('That expense was removed on another phone'); render(); }
function del(id) {
  if (!adm()) return deny();
  ask('Delete this expense? Everyone’s share changes. This cannot be undone.', () => {
    const x = getE(id); if (!x) return gone();
    lg(`Deleted expense: ${x.d || x.cc || x.cat} ${fm(x.amt)}`);
    D.ex = D.ex.filter(e => e.id != id); chkBud(); save(); render(); toast('Expense deleted');
  });
}
function edit(id) {
  if (!adm()) return deny();
  const e = getE(id); if (!e) return gone();
  F = { amt: String(e.amt), desc: e.d || '', cat: e.cat, cc: e.cc || '', by: e.by, edit: id };
  tab = 'add'; render();
}

/* ===== Settle Up ===== */
function pager(v, n, cur) { return n > 1 ? `<div class="pg" style="margin-top:4px"><button ${cur ? '' : 'disabled'} onclick="${v}--;render()">${ic('l')}</button><span class="sub">${cur + 1} / ${n}</span><button ${cur < n - 1 ? '' : 'disabled'} onclick="${v}++;render()">${ic('r')}</button></div>` : ''; }
function debts() {
  const c = calc();
  const head = `<div class="hd"><b>Settle Up</b><span class="sub">${esc(monthName())} · ${fm(c.tot)} ÷ ${c.n || 0} members = ${fm(c.each)} each</span></div><div class="seg">${[['bal', 'Balances'], ['pay', `Payments${D.pay.length ? ' (' + D.pay.length + ')' : ''}`]].map(([k, l]) => `<button class="${dsub == k ? 'on' : ''}" onclick="dsub='${k}';tpg=0;dpg=0;render()">${l}</button>`).join('')}</div>`;
  if (!approved()) return head + `<div class="card pad em">${ic('lock')}<br>The hisab appears once the admin accepts you.</div>`;
  if (dsub == 'pay') return head + payList();
  const t = tx(c.net), canPay = (f, o) => adm() || me() == f || me() == o;
  const bn = Math.max(1, Math.ceil(c.M.length / 3)), tn = Math.max(1, Math.ceil(t.length / 2));
  dpg = Math.min(dpg, bn - 1); tpg = Math.min(tpg, tn - 1);
  const rows = c.M.slice(dpg * 3, dpg * 3 + 3).map(k => { const v = c.net[k], w = balWord(v); return `<button class="rw brow" onclick="howCalc('${k}')">${av(k, 30)}<div class="fl"><b>${esc(N(k))}${k == me() ? ' (you)' : ''}</b><i>Paid ${fm(c.paid[k])} · Share ${fm(c.each)}</i></div><span class="bw ${w[0]}">${w[1]}</span></button>`; }).join('');
  const moves = t.slice(tpg * 2, tpg * 2 + 2).map(([f, o, m]) => `<div class="rw">${av(f, 26)}<div class="fl"><b>${f == me() ? 'You pay' : esc(S1(f)) + ' pays'} ${o == me() ? 'you' : esc(S1(o))}</b><i>${fm(m)}</i></div>${canPay(f, o) ? `<button class="chip on" onclick="mp('${f}','${o}',${Math.round(m)})">Mark paid</button>` : ''}</div>`).join('');
  return head + `<div><div class="lab">Everyone’s balance <span class="lh">· tap a name to see the working</span></div><div class="card pad">${rows || '<div class="em">No active members yet.</div>'}${pager('dpg', bn, dpg)}</div></div><div><div class="lab">Payments still needed</div><div class="card pad">${moves || `<div class="mv"><span class="mvi ok">${ic('ok')}</span><div class="fl"><b>Everyone is settled up</b><i>Nobody owes anything this month.</i></div></div>`}${pager('tpg', tn, tpg)}</div></div><div class="cap"><button class="btn gh" style="flex:1" onclick="howCalc()">${ic('swap')}How it works</button><button class="btn" style="flex:1.3" onclick="sm()">${ic('link')}Share summary</button></div>${c.heldN ? `<div class="sub" style="white-space:normal">${c.heldN} expense${c.heldN > 1 ? 's' : ''} by paused or former members not counted.</div>` : ''}`;
}
function payList() {
  const L = D.pay.slice().sort((a, b) => b.id - a.id), n = Math.max(1, Math.ceil(L.length / 4));
  tpg = Math.min(tpg, n - 1);
  return `<div class="card pad">${L.slice(tpg * 4, tpg * 4 + 4).map(p => `<div class="rw">${av(p.f, 28)}<div class="fl"><b>${p.f == me() ? 'You' : esc(S1(p.f))} paid ${p.t == me() ? 'you' : esc(S1(p.t))}</b><i>${p.ts ? dlab(p) : 'Earlier'}</i></div><b>${fm(p.a)}</b>${adm() ? `<button class="mini dng" onclick="delPay(${p.id})">Remove</button>` : ''}</div>`).join('') || '<div class="em">No payments recorded yet. When money changes hands, tap Mark paid in Balances.</div>'}${pager('tpg', n, tpg)}</div><div class="sub" style="white-space:normal">Payments move money between people. They change balances, not the room total.</div>`;
}
function mp(f, o, a) {
  if (needOk()) return;
  if (!adm() && me() != f && me() != o) return toast('Only the admin or the two people involved can record this');
  ask(`Confirm that ${f == me() ? 'you' : N(f)} paid ${o == me() ? 'you' : N(o)} ${fm(a)}? Balances update for everyone.`, () => {
    D.pay.push({ id: uid(), f, t: o, a, ts: Date.now() });
    D.nt.push({ id: uid(), by: me(), k: 'pay', f, t: o, a, tx: `${S1(f)} paid ${S1(o)} ${fm(a)}.` }); trimNt();
    lg(`Recorded payment: ${N(f)} paid ${N(o)} ${fm(a)}`); save(); render(); toast('Payment recorded');
  }, 'Yes, record it');
}
function delPay(id) {
  if (!adm()) return deny();
  const p = D.pay.find(x => x.id == id); if (!p) return;
  ask(`Remove the payment “${N(p.f)} paid ${N(p.t)} ${fm(p.a)}”? Balances go back to how they were before it.`, () => {
    D.pay = D.pay.filter(x => x.id != id); lg(`Removed payment: ${N(p.f)} paid ${N(p.t)} ${fm(p.a)}`); save(); render(); toast('Payment removed');
  }, 'Remove');
}

/* ===== Month-end summary (WhatsApp-ready) ===== */
function summaryText() {
  const c = calc(), t = tx(c.net), mon = monthName(), pays = D.pay.slice().sort((a, b) => a.id - b.id), L = [];
  L.push(`*SplitLedger · ${mon} Hisab*`, '');
  L.push(`Room total: *${fm(c.tot)}* (${c.count} expense${c.count == 1 ? '' : 's'})`);
  L.push(`Members: ${c.n} · Each share: *${fm(c.each)}*`, '');
  L.push('*What everyone paid*');
  c.M.forEach(k => L.push(`• ${N(k)}: ${fm(c.paid[k])}`));
  if (pays.length) { L.push('', '*Payments already made*'); pays.forEach(p => L.push(`• ${N(p.f)} → ${N(p.t)}: ${fm(p.a)}`)); }
  L.push('', '*Balances*');
  c.M.forEach(k => { const v = c.net[k]; L.push(`• ${N(k)}: ${v > .5 ? 'gets back ' + fm(v) : v < -.5 ? 'owes ' + fm(v) : 'settled ✅'}`); });
  L.push('', '*To settle the month*');
  if (t.length) t.forEach(([f, o, m]) => L.push(`👉 ${N(f)} pays ${N(o)} *${fm(m)}*`)); else L.push('✅ Everyone is settled up.');
  return L.join('\n');
}
function sm() {
  const c = calc(), t = tx(c.net), mon = monthName(), pays = D.pay.slice().sort((a, b) => a.id - b.id);
  const kv = (l, v, cls) => `<div class="kv"><span>${l}</span><b class="${cls || ''}">${v}</b></div>`;
  ov(`<h3>Month-end summary${X}</h3><div class="sumc"><div class="sumh"><b>${esc(mon)} Hisab</b><span>${c.count} expense${c.count == 1 ? '' : 's'} · ${c.n} members</span></div>${kv('Room total', fm(c.tot))}${kv('Each share', fm(c.each), 'acc')}<div class="sl2">What everyone paid</div>${c.M.map(k => kv(esc(N(k)), fm(c.paid[k]))).join('')}${pays.length ? `<div class="sl2">Payments already made</div>${pays.map(p => kv(`${esc(S1(p.f))} → ${esc(S1(p.t))}`, fm(p.a))).join('')}` : ''}<div class="sl2">To settle the month</div>${t.length ? t.map(([f, o, m]) => kv(`<b>${esc(S1(f))}</b> pays <b>${esc(S1(o))}</b>`, fm(m), 'neg')).join('') : `<div class="sub" style="color:var(--g);font-weight:700">Everyone is settled up.</div>`}</div><div class="cap"><button class="btn gh" style="flex:1" onclick="cpSum()">${ic('copy')}Copy</button><button class="btn" style="flex:1.4" onclick="shareSum()">${ic('link')}Share on WhatsApp</button></div>`);
}
function shareSum() { shareText(summaryText()); }
function cpSum() { copyText(summaryText()); }
function shareText(s) {
  if (window.SLNative && SLNative.share) { try { SLNative.share(s); return; } catch (e) { } }
  if (navigator.share) return navigator.share({ text: s }).catch(() => copyText(s));
  window.open('https://wa.me/?text=' + encodeURIComponent(s), '_blank');
}
function copyText(s) {
  const ok = () => toast('Copied. Paste it in WhatsApp');
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s).then(ok, () => fallbackCopy(s));
  fallbackCopy(s);
}
function fallbackCopy(s) { const t = document.createElement('textarea'); t.value = s; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let r = false; try { r = document.execCommand('copy'); } catch (e) { } t.remove(); toast(r ? 'Copied. Paste it in WhatsApp' : 'Could not copy on this phone'); }
function share(h, s) { ov(`<h3>${esc(h)}${X}</h3><textarea id="bt" rows="9" readonly>${esc(s)}</textarea><div class="cap"><button class="btn gh" style="flex:1" onclick="cp()">${ic('copy')}Copy</button><button class="btn" style="flex:1" onclick="cpShare()">${ic('link')}Share</button></div>`); }
function cp() { copyText($('#bt').value); }
function cpShare() { shareText($('#bt').value); }

/* ===== Add / Edit ===== */
function pc() { dd('Category', CATS.map(c => ({ k: c, l: c })), F.cat, k => { F.cat = k; render(); }); }
function pb() { dd('Paid by', act().map(k => ({ k, l: N(k), a: av(k, 26) })), F.by, k => { F.by = k; render(); }); }
function add() {
  if (!approved()) return `<div class="hd"><b>New expense</b><span class="sub">Waiting for admin approval</span></div><div class="card pad em">${ic('lock')}<br>You can add expenses once the admin accepts you.</div>`;
  const a = adm();
  if (!a || !PK[F.by]) F.by = me();
  return `<div class="hd"><b>${F.edit ? 'Edit expense' : 'New expense'}</b><span class="sub">${F.edit ? '<button class="lk" style="display:inline" onclick="cancelEdit()">Cancel edit</button>' : 'Shared equally by everyone in the room'}</span></div><div><div class="lab">Amount (${esc(V.cur || 'Rs.')})</div><input class="amt" inputmode="decimal" placeholder="0" value="${esc(F.amt)}" oninput="F.amt=this.value;pv()" autocomplete="off"></div><div><div class="lab">What was it for?</div><input placeholder="e.g. Sabzi, rashan" maxlength="40" value="${esc(F.desc)}" oninput="F.desc=this.value" autocomplete="off"></div><div class="cap"><div style="flex:1.2;min-width:0"><div class="lab">Category</div>${F.cat == 'Other' ? `<input placeholder="Type, e.g. Fuel" maxlength="24" value="${esc(F.cc)}" oninput="F.cc=this.value" autocomplete="off">` : `<button class="fld" onclick="pc()"><span>${F.cat}</span>${ic('d')}</button>`}</div><div style="flex:1;min-width:0"><div class="lab">Paid by</div><button class="fld" ${a ? 'onclick="pb()"' : ''}><span>${esc(F.by == me() ? 'Me' : S1(F.by))}</span>${a ? ic('d') : ic('lock')}</button></div></div>${F.cat == 'Other' ? '<button class="lk" style="align-self:flex-start" onclick="pc()">Change category</button>' : ''}<div class="card pad" id="pv"></div><button class="btn" onclick="saveE()">${ic('ok')}${F.edit ? 'Update' : 'Save'} expense</button>`;
}
function cancelEdit() { newF(); render(); }
function pv() {
  const e = $('#pv'); if (!e) return;
  const M = act(), a = num(F.amt) || 0, n = M.length || 1;
  e.innerHTML = `<div class="pvh"><b>Split equally between ${M.length} member${M.length == 1 ? '' : 's'}</b><span>${a ? fm(a / n) + ' each' : 'Enter an amount'}</span></div><div class="pva">${M.slice(0, 6).map(k => `<span class="pvp">${av(k, 22)}${esc(k == me() ? 'You' : S1(k))}</span>`).join('')}${M.length > 6 ? `<span class="pvp">+${M.length - 6}</span>` : ''}</div>`;
}
function saveE() {
  if (needOk()) return;
  const a = num(F.amt);
  if (!(a > 0)) return toast('Enter an amount greater than 0');
  if (a > 10000000) return toast('That amount looks too large');
  if (F.cat == 'Other' && !(F.cc || '').trim() && !F.desc.trim()) return toast('Type a category or a description');
  if (F.edit && !getE(F.edit)) { newF(); return gone(); }
  if (!act().length) return toast('There are no active members');
  if (F.edit && !_cf) return ask('Update this expense? Everyone’s share will change.', () => { _cf = 1; saveE(); _cf = 0; });
  const by = adm() && PK[F.by] ? F.by : me(), d = F.desc.trim(), cc = F.cat == 'Other' ? (F.cc || '').trim() : '', what = d || cc || F.cat, M = act();
  if (F.edit) {
    if (!adm()) return deny();
    Object.assign(getE(F.edit), { amt: a, cat: F.cat, cc, d, by });
  } else {
    const id = uid();
    D.ex.push({ id, by, amt: a, cat: F.cat, cc, d, sp: M.join(','), ts: Date.now() });
    D.nt.push({ id, by: me(), k: 'ex', p: by, a, d: what, n: M.length, tx: `${S1(by)} added ${what} · ${fm(a)} (${fm(a / M.length)} each).` });
  }
  lg(`${F.edit ? 'Updated' : 'Added'} expense: ${what} ${fm(a)}`);
  chkBud(); newF(); save(); go('ledger'); toast('Expense saved');
}

/* ===== Insights ===== */
function ins() {
  const c = calc(), T = {};
  D.ex.forEach(e => { if (counted(e)) { const k = e.cat == 'Other' && e.cc ? e.cc : e.cat; T[k] = (T[k] || 0) + e.amt; } });
  let K = Object.keys(T).sort((a, b) => T[b] - T[a]);
  if (K.length > 5) { T['More'] = K.slice(4).reduce((s, k) => s + T[k], 0); K = K.slice(0, 4).concat('More'); }
  const tot = K.reduce((s, k) => s + T[k], 0); let o = 0;
  const seg = K.map((k, i) => {
    const p = tot ? T[k] / tot * 100 : 0, gap = K.length > 1 ? Math.min(5, p * .4) : 0, d = Math.max(p - gap, .01);
    const s = p > 0 ? `<circle r="15.9" cx="18" cy="18" fill="none" stroke="${CC[i % CC.length]}" stroke-width="4" stroke-linecap="${K.length > 1 ? 'round' : 'butt'}" stroke-dasharray="${d} ${100 - d}" stroke-dashoffset="${-(o + gap / 2)}"/>` : '';
    o += p; return s;
  }).join('');
  const P = c.M.slice().sort((a, b) => c.paid[b] - c.paid[a]), mx = Math.max(1, ...P.map(k => c.paid[k]));
  const big = D.ex.filter(counted).sort((a, b) => b.amt - a.amt)[0];
  return `<div class="hd"><b>Insights</b><span class="sub">${esc(monthName())} at a glance</span></div><div class="g3"><div class="stc"><i>Room total</i><b>${fm(c.tot)}</b></div><div class="stc"><i>Each share</i><b>${fm(c.each)}</b></div><div class="stc"><i>Biggest</i><b>${big ? fm(big.amt) : '—'}</b></div></div><div class="card pad"><div class="lab">Spending by category</div>${K.length ? `<div class="dnr"><svg viewBox="0 0 36 36" width="104" height="104" role="img" aria-label="Spending by category"><circle r="15.9" cx="18" cy="18" fill="none" stroke="var(--chip)" stroke-width="4"/><g transform="rotate(-90 18 18)">${seg}</g></svg><div class="fl">${K.map((k, i) => `<div class="lg"><span class="dt" style="background:${CC[i % CC.length]}"></span><span class="ln">${esc(k)}</span><span class="sub">${fm(T[k])}</span><b>${tot ? Math.round(T[k] / tot * 100) : 0}%</b></div>`).join('')}</div></div>` : '<div class="em">No spending yet this month.</div>'}</div><div class="card pad"><div class="lab">Who paid what</div>${P.slice(0, 4).map(k => `<div class="pbr">${av(k, 22)}<span class="ln">${esc(k == me() ? 'You' : S1(k))}</span><div class="pbt"><i style="width:${Math.round(c.paid[k] / mx * 100)}%"></i></div><b>${fm(c.paid[k])}</b></div>`).join('') || '<div class="em">No members yet.</div>'}${P.length > 4 ? `<button class="lk" onclick="go('debts')">See all ${P.length} in Settle Up</button>` : ''}</div>`;
}

/* ===== Side-panel pages ===== */

function sb() {

function hp(s) { let h = 5381; for (const c of 'sl' + s) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h; }
function lockScreen() {
  const o = $('#ov');
  o.innerHTML = H(`<div class="sh"><h3>Enter your app PIN</h3><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off"><button class="btn" onclick="ul()">Unlock</button><button class="btn gh" onclick="forgotPin()">Forgot PIN? Sign out</button></div>`);
  o.dataset.lk = 1; o.style.background = 'var(--bg)'; void o.offsetWidth; o.classList.add('show');
  setTimeout(() => { const p = $('#pn'); if (p) p.focus(); }, 50);
}

  const r = V.pl || { n: 0, u: 0 };

  if (hp($('#pn').value) == V.pin) { delete V.pl; saveLocal(); unlock(); }
  else { r.n++; if (r.n >= 5) r.u = Date.now() + 30000 * Math.pow(2, Math.min(4, r.n - 5)); V.pl = r; saveLocal(); $('#pn').value = ''; toast(r.n >= 5 ? 'Wrong PIN. Locked for a while' : 'Wrong PIN'); }
}
