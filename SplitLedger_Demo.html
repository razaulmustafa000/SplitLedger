:root,:root[data-t=indigo]{--on:#fff;--bg:#EEF0FA;--card:#fff;--tx:#14142B;--sub:#5F647C;--ln:#E4E6F2;--pri:#4F46E5;--soft:#EDEEFF;--h1:#1E1B4B;--h2:#312E81;--g:#087F5B;--r:#D61F45;--gb:#DDF5EA;--chip:#F0F1F8;--sh:0 2px 10px rgba(30,27,75,.07);--glow:rgba(79,70,229,.4);--am:#B45309}
:root[data-t=light]{--bg:#fff;--soft:#F0F4FF;--chip:#F3F4F6;--ln:#E5E7EB;--h2:#4338CA}
:root[data-t=fb]{--bg:#F0F2F5;--tx:#050505;--sub:#65676B;--ln:#DADDE1;--pri:#1877F2;--soft:#E7F1FF;--h1:#0A4FB8;--h2:#1877F2;--glow:rgba(24,119,242,.4);--chip:#F0F2F5}
:root[data-t=wa]{--bg:#F5F6F6;--tx:#111B21;--sub:#54656F;--ln:#E1E5E8;--pri:#008069;--soft:#DDF6EE;--h1:#005C4B;--h2:#008069;--glow:rgba(0,128,105,.4);--chip:#EEF1F2;--g:#00704F}
:root[data-t=amoled]{--bg:#000;--card:#101014;--tx:#F4F4F8;--sub:#A3A6BA;--ln:#25252D;--pri:#8B5CF6;--soft:#1D1535;--h1:#150B33;--h2:#3B1D8F;--g:#34D399;--r:#FB7185;--gb:#0B2B21;--chip:#1A1A21;--sh:none;--glow:rgba(139,92,246,.5);--am:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);font-variant-numeric:tabular-nums;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;overflow:hidden!important;display:flex;flex-direction:column;background:var(--bg);font-size:13px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-fs=s] #app{font-size:12px}:root[data-fs=l] #app{font-size:14.5px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}button:disabled{opacity:.4}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:.75em 1em;width:100%;outline:0}input:focus{border-color:var(--pri)}input.amt{font-size:1.7em;font-weight:800}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;gap:6px;flex:none}
.rt{display:flex;gap:4px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:3px 11px 3px 3px;box-shadow:var(--sh);min-width:0;flex:0 1 auto;max-width:150px}.pill span{font-weight:700;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center;flex:none}
.live{display:flex;align-items:center;gap:3px;background:var(--gb);color:var(--g);font-weight:800;font-size:.66em;letter-spacing:.04em;padding:6px 8px;border-radius:99px;white-space:nowrap;margin-right:2px}.live.off{background:var(--chip);color:var(--sub)}.live.err{background:var(--chip);color:var(--r)}.live svg{width:1em;height:1em}
.ib{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--ln);display:grid;place-items:center;position:relative;box-shadow:var(--sh);flex:none}
.bd{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;font-size:.62em;min-width:15px;height:15px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 3px;font-style:normal}
#main{flex:1;min-height:0;padding:4px 10px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--ln)}.pad{padding:9px 11px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 10px 24px -10px var(--glow);flex:none}
.hero .t{display:flex;justify-content:space-between;align-items:center;font-size:.68em;letter-spacing:.1em;font-weight:700;color:#E0E3FF}
.mp{background:rgba(45,212,191,.2);color:#5EEAD4;padding:3px 8px;border-radius:99px;font-size:.95em}
.hero .big{font-size:2.1em;font-weight:800;margin:4px 0 8px;letter-spacing:-.02em}
.hero .row{display:flex;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}.hero .row>div{flex:1}.hero small{display:block;font-size:.72em;color:#D4D8FF}.hero .row b{font-size:1.05em}.in{color:#4ADE80}.out{color:#FDA4AF}
.g6{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px}
.sc{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);min-height:0;position:relative;overflow:hidden}
.sc.on{border:1.5px solid var(--pri);background:var(--soft)}.sc .sl{font-size:.72em;color:var(--sub);font-weight:600}.sc b{font-size:1.1em;font-weight:800}.sc i,.sub{font-style:normal;font-size:.7em;color:var(--sub)}.si{position:absolute;top:7px;right:8px;color:var(--pri)}
.pos{color:var(--g)}.neg{color:var(--r)}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),#A78BFA);transition:width .5s}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.bh b{font-size:.85em}.bh span{font-size:.8em;font-weight:700}
.sync{flex:1.15;min-height:0;display:flex;flex-direction:column;padding:9px 10px;gap:6px}.g4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;min-height:0}
.mc{background:var(--chip);border-radius:12px;padding:6px 9px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:0}.mh{display:flex;align-items:center;gap:6px}.dt{width:9px;height:9px;border-radius:50%;flex:none}
.cn{align-self:flex-start;background:var(--gb);color:var(--g);font-size:.66em;font-weight:800;padding:2px 7px;border-radius:99px}.cn.pz{background:var(--soft);color:var(--sub)}
.lk{color:var(--pri);font-weight:700;font-size:.8em;display:flex;align-items:center;gap:6px}
#nav{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);margin:0 10px 10px;padding:6px;border-radius:99px;border:1px solid var(--ln);flex:none;position:relative;z-index:5}
.nb{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;border-radius:99px;background:var(--chip);color:var(--tx);font-size:.82em;font-weight:700}.nb span{display:none}.nb.on{background:var(--navon,var(--pri));color:var(--navc,var(--on));padding:0 16px}.nb.on span{display:inline}
.hd{display:flex;flex-direction:column;align-items:flex-start;gap:1px}.hd b{font-size:1.55em;font-weight:700;letter-spacing:-.01em}
.lab{font-size:.68em;color:var(--sub);font-weight:700;letter-spacing:.05em;margin:0 0 4px 2px;text-transform:uppercase}.nt{margin:4px 0 0 2px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;text-align:center;padding:.55em 0;border-radius:9px;font-weight:600;font-size:.85em;color:var(--sub)}.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip,.tag{padding:.38em .8em;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:.8em;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:4px}.chip.on,.tag{background:var(--pri);border-color:var(--pri);color:var(--on)}.tag{align-self:flex-start}.tag svg{width:1em;height:1em}
.lst{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.li,.rw{display:flex;align-items:center;gap:9px}.li{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;box-shadow:var(--sh)}.rw{padding:5px 0}.li.ps{opacity:.5}
.ci{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.fl{flex:1;min-width:0;display:flex;flex-direction:column}.fl b,.fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92em}.fl i{font-style:normal;font-size:.7em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}.ac{display:flex;gap:10px;color:var(--sub)}.ac svg{width:1.05em;height:1.05em}
.pg{display:flex;justify-content:space-between;align-items:center;flex:none}.pg button{display:flex;align-items:center;gap:2px;padding:.5em .8em;border-radius:10px;background:var(--card);border:1px solid var(--ln);font-weight:600;font-size:.85em}
.em{text-align:center;color:var(--sub);padding:18px 0;font-size:.9em}
.fld{width:100%;display:flex;justify-content:space-between;align-items:center;padding:.75em 1em;border:1px solid var(--ln);border-radius:12px;background:var(--card);font-weight:600}
.btn{background:var(--pri);color:var(--on);border-radius:13px;padding:.8em 1em;text-align:center;font-weight:700;display:flex;justify-content:center;align-items:center;gap:6px;flex:none}.btn.gh{background:var(--chip);color:var(--tx)}.btn.dng{background:var(--r);color:#fff}[data-t=amoled] .btn.dng,[data-t=olive] .btn.dng{color:#000}
#pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#pv span{background:var(--chip);border-radius:99px;padding:.3em .7em;font-size:.8em;font-weight:600}
#ov{position:absolute;inset:0;background:rgba(5,5,20,.55);display:none;align-items:flex-end;z-index:20}#ov.show{display:flex}
.sh{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:7px;animation:up .22s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{font-size:1.1em;display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--ln);width:100%;color:var(--tx)}.opt.on{border-color:var(--pri);background:var(--soft)}.opt>svg{color:var(--pri)}

/* ===== SplitLedger v2.3 ===== */
/* Optional: paste your server link here so nobody has to type it. Example: 'https://yourname.github.io/splitledger' */
const SERVER = '';
const ADMIN = 'daniel.carter@example.com';
/* Guest preview build: opens straight into sample data, no server, nothing saved (set by web/build.py --guest) */
const GUEST = true;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fm = n => (V.cur || 'Rs.') + ' ' + (Math.round(Math.abs(n)) || 0).toLocaleString('en-IN');
const num = s => parseFloat(String(s == null ? '' : s).replace(/[,\s]/g, ''));
const uid = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);
const ic = n => `<svg class="i" viewBox="0 0 24 24">${I[n] || ''}</svg>`;
const ekey = e => String(e || '').trim().toLowerCase().replace(/\./g, ',');
const EMRX = /^[^\s@,#$\[\]\/]+@[^\s@,#$\[\]\/]+\.[a-z]{2,}$/i;
const rnd = n => { const A = 'abcdefghjkmnpqrstuvwxyz23456789', r = new Uint32Array(n); crypto.getRandomValues(r); return Array.from(r, x => A[x % A.length]).join(''); };

const CATS = ['Grocery', 'Wi-Fi Bill', 'Utilities', 'Rent', 'Other'];
const CI = { Grocery: 'cart', 'Wi-Fi Bill': 'wifi', Utilities: 'bolt', Rent: 'home', Other: 'tag' };
const CC = ['#FF9AA2', '#FFE08A', '#B5EAB0', '#A8B8FF', '#D58BFF', '#9AD9E8'];
const PAL = ['#6366F1', '#D97706', '#059669', '#DB2777', '#0891B2', '#7C3AED', '#65A30D', '#DC2626'];
const TH = [['olive', 'Olive Lime', '#B8F03E'], ['indigo', 'Fintech Indigo', '#312E81'], ['light', 'Clean White', '#FFFFFF'], ['fb', 'Facebook Native', '#1877F2'], ['wa', 'WhatsApp Native', '#008069'], ['amoled', 'AMOLED Dark', '#000000']];
const METH = { entry: 'By Entry', eq: 'Equal Split' };

/* ----- device settings ----- */
var V = { th: 'olive', fs: 'n', vw: 'c', seen: {} };
try { Object.assign(V, JSON.parse(localStorage.getItem('sl_v') || '{}')); } catch (e) { }
if (!V.seen || typeof V.seen != 'object') V.seen = {};

/* ----- who am I ----- */
var ME = { status: '', email: '', ek: '', key: '', admin: false };
var DEMO = 0;
/* members from the server, by email key */
var MB = {}, PK = {};
function people() {
  return Object.values(MB).filter(m => m && m.status == 'approved' && m.key)
    .sort((a, b) => (b.key == 'adm') - (a.key == 'adm') || (a.approvedAt || 0) - (b.approvedAt || 0) || String(a.email).localeCompare(b.email));
}
function reindex() {
  PK = {};

}
const anyKey = k => PK[k] || Object.values(MB).find(m => m && m.key == k);

}

const act = () => people().filter(p => !p.paused).map(p => p.key);

/* dates */
const DM = { day: '2-digit', month: 'short' };
function dlab(e, yr) {

}
const tm = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

/* ----- the ledger ----- */
const COLS = ['ex', 'pay', 'nt', 'log', 'hist'];
function blank() { return { ex: [], pay: [], nt: [], log: [], hist: [], sm: 'entry', bud: 20000, ba: 0, wifi: '' }; }
function migrate(o) {
  const d = Object.assign(blank(), o || {});
  COLS.forEach(k => {
    if (!Array.isArray(d[k])) d[k] = d[k] && typeof d[k] == 'object' ? Object.values(d[k]) : [];
    d[k] = d[k].filter(x => x && typeof x == 'object' && x.id);
  });
  d.ex = d.ex.filter(e => e.by && num(e.amt) > 0);
  d.ex.forEach(e => { e.amt = num(e.amt); if (!CATS.includes(e.cat)) e.cat = 'Other'; });
  if (!METH[d.sm]) d.sm = 'entry';
  d.bud = Math.max(1, num(d.bud) || 20000);
  d.ba = d.ba ? 1 : 0;
  if (typeof d.wifi != 'string') d.wifi = '';
  return d;
}
var D = blank();

/* ui state (var: read and written by the click interpreter) */
var qs = '', tab = 'dash', pg = 0, cf = 'all', pf = null, sel = 'all', isub = 'ch', stab = 'g', lu = 'all', lpg = 0, hpg = 0, mpg = 0, dpg = 0, tpg = 0;
var _cb, _cf = 0, _pf = null, _lt = 'dash', _pp = 0;
var F;
function newF() {
  F = { amt: '', desc: '', cat: V.dcat || 'Grocery', cc: '', by: me(), edit: null };
}

/* ----- money logic -----
   One simple rule: every expense of the month is shared equally by all active members.
   Balance = what you paid - your share + payments you sent - payments you received.
   Positive = you get money back. Negative = you owe. */
const counted = e => !!(PK[e.by] && !PK[e.by].paused);
function calc() {
  const M = act(), n = M.length;
  const z = () => { const o = {}; M.forEach(k => o[k] = 0); return o; };
  const paid = z(), sent = z(), recv = z(), cnt = z();
  let tot = 0, held = 0, heldN = 0;
  D.ex.forEach(e => {
    if (!counted(e)) { held += e.amt; heldN++; return; }
    tot += e.amt; paid[e.by] += e.amt; cnt[e.by]++;
  });
  const each = n ? tot / n : 0;
  D.pay.forEach(p => { if (paid[p.f] != null && paid[p.t] != null) { sent[p.f] += p.a; recv[p.t] += p.a; } });
  const net = {};
  M.forEach(k => net[k] = paid[k] - each + sent[k] - recv[k]);
  return { M, n, tot, each, paid, sent, recv, cnt, net, held, heldN, count: D.ex.length - heldN };
}
/* ----- hisab between two people -----
   Every expense is shared equally by all active members, so between me (k) and someone else (o):
   o owes me their share of what I spent, and I owe o my share of what o spent.
   bal > 0: o owes me.  bal < 0: I owe o.  Payments between the two of us are counted in. */
function pair(c, k, o) {
  const n = c.n || 1, theyPaid = c.paid[o] || 0, iPaid = c.paid[k] || 0;
  let iSent = 0, theySent = 0;
  D.pay.forEach(p => { if (p.f == k && p.t == o) iSent += p.a; else if (p.f == o && p.t == k) theySent += p.a; });
  const iOwe = theyPaid / n, theyOwe = iPaid / n;
  return { o, theyPaid, iPaid, iOwe, theyOwe, iSent, theySent, bal: theyOwe - iOwe + iSent - theySent };
}
/* everyone else, biggest open hisab first */
function myPairs(c) {
  const k = me();
  if (!c.M.includes(k)) return [];
  return c.M.filter(o => o != k).map(o => pair(c, k, o)).sort((a, b) => Math.abs(b.bal) - Math.abs(a.bal) || b.theyPaid - a.theyPaid);
}
/* every open hisab in the room as [payer, receiver, amount] */
function moves(c) {
  const out = [];
  c.M.forEach((a, i) => c.M.slice(i + 1).forEach(b => {
    const p = pair(c, a, b);
    if (p.bal > .5) out.push([b, a, p.bal]); else if (p.bal < -.5) out.push([a, b, -p.bal]);
  }));
  return out.sort((x, y) => y[2] - x[2]);
}
/* fewest transfers that settle everyone */
function tx(net) {
  const d = [], c = [];
  for (const k in net) { if (net[k] < -.5) d.push([k, -net[k]]); else if (net[k] > .5) c.push([k, net[k]]); }
  d.sort((a, b) => b[1] - a[1]); c.sort((a, b) => b[1] - a[1]);
  const o = []; let i = 0, j = 0;
  while (i < d.length && j < c.length) {
    const m = Math.min(d[i][1], c[j][1]);
    o.push([d[i][0], c[j][0], m]); d[i][1] -= m; c[j][1] -= m;
    if (d[i][1] < .5) i++; if (c[j][1] < .5) j++;
  }
  return o;
}
/* budget alert fires once when the line is crossed, re-arms if spending drops back */
function chkBud() {
  const c = calc(), line = D.bud * (V.thr || 90) / 100;

    D.ba = 1;
    D.nt.push({ id: uid(), by: me(), tx: `Budget alert: ${Math.round(c.tot / D.bud * 100)}% of the monthly budget is used.` });
  } else if (c.tot < line && D.ba) D.ba = 0;
  trimNt();
}
/* only the admin trims shared lists (members may only add to them) */
function trimNt() { if (!adm()) return; D.nt.sort((a, b) => a.id - b.id); while (D.nt.length > 30) D.nt.shift(); }
function lg(a) {
  if (!approved() || !me()) return;
  D.log.push({ id: uid(), t: Date.now(), u: me(), a });
  if (adm()) { D.log.sort((x, y) => x.id - y.id); while (D.log.length > 300) D.log.shift(); }
}
function monthLabel(list) {
  const cnt = {};
  list.forEach(e => { if (e.ts) { const d = new Date(e.ts), k = d.getFullYear() * 12 + d.getMonth(); cnt[k] = (cnt[k] || 0) + 1; } });
  const ks = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);

}

/* notification text written for the person reading it */
function ntText(n) {

  if (n.k == 'ex') {

}

/* numbers glide to their new value */
var _cv = {};
function countUp() {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-n]').forEach(el => {
    const id = el.dataset.id, to = +el.dataset.n, from = _cv[id] == null ? 0 : _cv[id], pre = el.dataset.pre || '';
    _cv[id] = to;
    if (reduce || from == to || !id) { el.textContent = pre + fm(to); return; }
    const t0 = performance.now(), d = 650;
    const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + fm(from + (to - from) * e); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
    el.textContent = pre + fm(from); requestAnimationFrame(step);
  });
}
const num$ = (id, v, pre) => `<span data-id="${id}" data-n="${Math.round(v)}" data-pre="${pre || ''}">${pre || ''}${fm(v)}</span>`;

/* how the hisab works, in general */
function howCalc() {
  const c = calc();
  ov(`<h3>How the hisab works${X}</h3><div class="card pad"><div class="stp"><b>1</b><span>Every expense is shared equally by all ${c.n} active members.</span></div><div class="stp"><b>2</b><span>When someone spends, each other member owes them their share: <em>amount ÷ ${c.n}</em>.</span></div><div class="stp"><b>3</b><span>Between you and each roommate, what they owe you and what you owe them cancel out. Only the difference is paid.</span></div><div class="stp"><b>4</b><span>When money is handed over, tap <em>I paid</em> or <em>Mark paid</em>. That hisab goes to zero.</span></div></div><div class="note">Example: Sara spends Rs. 1,500 and you spend nothing. With 2 members, your share is 1,500 ÷ 2 = Rs. 750. So you owe Sara Rs. 750.</div><div class="sub" style="white-space:normal">Tap any roommate’s card on the Dashboard to see your exact numbers with them.</div>`);
}

/* ===== Settle Up ===== */
function pager(v, n, cur) { return n > 1 ? `<div class="pg" style="margin-top:4px"><button ${cur ? '' : 'disabled'} onclick="${v}--;render()">${ic('l')}</button><span class="sub">${cur + 1} / ${n}</span><button ${cur < n - 1 ? '' : 'disabled'} onclick="${v}++;render()">${ic('r')}</button></div>` : ''; }
function debts() {
  const c = calc();
  const head = `<div class="hd"><b>Settle Up</b><span class="sub">${esc(monthName())} · ${fm(c.tot)} spent by ${c.n} member${c.n == 1 ? '' : 's'}</span></div><div class="seg">${[['bal', 'My hisab'], ['all', 'Everyone'], ['pay', `Payments${D.pay.length ? ' (' + D.pay.length + ')' : ''}`]].map(([k, l]) => `<button class="${dsub == k ? 'on' : ''}" onclick="dsub='${k}';tpg=0;dpg=0;render()">${l}</button>`).join('')}</div>`;
  if (!approved()) return head + `<div class="card pad em">${ic('lock')}<br>The hisab appears once the admin accepts you.</div>`;
  if (dsub == 'pay') return head + payList();
  if (dsub == 'all') {
    const t = moves(c), n = Math.max(1, Math.ceil(t.length / 4)); tpg = Math.min(tpg, n - 1);
    const canPay = (f, o) => adm() || me() == f || me() == o;
    return head + `<div class="card pad">${t.slice(tpg * 4, tpg * 4 + 4).map(([f, o, m]) => `<div class="rw">${av(f, 28)}<div class="fl"><b>${esc(NM(f))} → ${esc(NM(o))}</b><i>${f == me() ? 'You pay' : esc(S1(f)) + ' pays'} ${o == me() ? 'you' : esc(S1(o))}</i></div><b>${fm(m)}</b>${canPay(f, o) ? `<button class="chip on" onclick="mp('${f}','${o}',${Math.round(m)})">Paid</button>` : ''}</div>`).join('') || `<div class="mv"><span class="mvi ok">${ic('ok')}</span><div class="fl"><b>Everyone is settled up</b><i>Nobody owes anything this month.</i></div></div>`}${pager('tpg', n, tpg)}</div><div class="cap"><button class="btn gh" style="flex:1" onclick="howCalc()">${ic('swap')}How it works</button><button class="btn" style="flex:1.3" onclick="sm()">${ic('link')}Share summary</button></div>`;
  }
  const P = myPairs(c), n = Math.max(1, Math.ceil(P.length / 3)); dpg = Math.min(dpg, n - 1);
  const owe = P.reduce((s, p) => s + Math.max(0, -p.bal), 0), get = P.reduce((s, p) => s + Math.max(0, p.bal), 0);
  const rows = P.slice(dpg * 3, dpg * 3 + 3).map(p => { const l = pairLine(p); return `<div class="prow"><button class="prm" onclick="pairSheet('${p.o}')">${av(p.o, 32)}<div class="fl"><b>${esc(N(p.o))}</b><i>Spent ${fm(p.theyPaid)} · you give ${fm(p.iOwe)} · you get ${fm(p.theyOwe)}</i></div></button><div class="prb"><span class="bw ${l[0]}">${esc(l[1].replace(S1(p.o) + ' owes you', 'Owes you').replace('You owe ' + S1(p.o), 'You owe'))}</span>${p.bal < -.5 ? `<button class="chip on" onclick="mp('${me()}','${p.o}',${Math.round(-p.bal)})">I paid</button>` : p.bal > .5 ? `<button class="chip on" onclick="mp('${p.o}','${me()}',${Math.round(p.bal)})">Got it</button>` : ''}</div></div>`; }).join('');
  return head + `<div class="g2"><div class="stc bad"><i>You need to pay</i><b>${fm(owe)}</b></div><div class="stc good"><i>You will get</i><b>${fm(get)}</b></div></div><div><div class="lab">Your hisab with each roommate <span class="lh">· tap for the full working</span></div><div class="card pad">${rows || `<div class="em">${c.M.includes(me()) ? 'No other members yet.' : 'You are paused this month.'}</div>`}${pager('dpg', n, dpg)}</div></div><div class="cap"><button class="btn gh" style="flex:1" onclick="howCalc()">${ic('swap')}How it works</button><button class="btn" style="flex:1.3" onclick="sm()">${ic('link')}Share summary</button></div>`;
}
function payList() {
  const L = D.pay.slice().sort((a, b) => b.id - a.id), n = Math.max(1, Math.ceil(L.length / 4));
  tpg = Math.min(tpg, n - 1);
  return `<div class="card pad">${L.slice(tpg * 4, tpg * 4 + 4).map(p => `<div class="rw">${av(p.f, 28)}<div class="fl"><b>${p.f == me() ? 'You' : esc(S1(p.f))} paid ${p.t == me() ? 'you' : esc(S1(p.t))}</b><i>${p.ts ? dlab(p) : 'Earlier'}</i></div><b>${fm(p.a)}</b>${adm() ? `<button class="mini dng" onclick="delPay(${p.id})">Remove</button>` : ''}</div>`).join('') || '<div class="em">No payments recorded yet. When money changes hands, tap I paid or Got it in My hisab.</div>'}${pager('tpg', n, tpg)}</div><div class="sub" style="white-space:normal">Payments move money between people. They change balances, not the room total.</div>`;
}
function mp(f, o, a) {
  if (needOk()) return;
  if (!adm() && me() != f && me() != o) return toast('Only the admin or the two people involved can record this');
  ask(`Confirm that ${f == me() ? 'you' : N(f)} paid ${o == me() ? 'you' : N(o)} ${fm(a)}? Balances update for everyone.`, () => {
    D.pay.push({ id: uid(), f, t: o, a, ts: Date.now() });
    D.nt.push({ id: uid(), by: me(), k: 'pay', f, t: o, a, tx: `${S1(f)} paid ${S1(o)} ${fm(a)}.` }); trimNt();
    lg(`Recorded payment: ${N(f)} paid ${N(o)} ${fm(a)}`); save(); render(); toast('Payment recorded');
  }, 'Yes, record it');
}
function delPay(id) {
  if (!adm()) return deny();
  const p = D.pay.find(x => x.id == id); if (!p) return;
  ask(`Remove the payment “${N(p.f)} paid ${N(p.t)} ${fm(p.a)}”? Balances go back to how they were before it.`, () => {
    D.pay = D.pay.filter(x => x.id != id); lg(`Removed payment: ${N(p.f)} paid ${N(p.t)} ${fm(p.a)}`); save(); render(); toast('Payment removed');
  }, 'Remove');
}

/* ===== Month-end summary (WhatsApp-ready) ===== */
function summaryText() {
  const c = calc(), t = moves(c), mon = monthName(), pays = D.pay.slice().sort((a, b) => a.id - b.id), L = [];

  c.M.forEach(k => { const v = c.net[k]; L.push(`• ${N(k)}: ${v > .5 ? 'gets back ' + fm(v) : v < -.5 ? 'owes ' + fm(v) : 'settled ✅'}`); });
  L.push('', '*To settle the month*');

function sm() {
  const c = calc(), t = moves(c), mon = monthName(), pays = D.pay.slice().sort((a, b) => a.id - b.id);
  const kv = (l, v, cls) => `<div class="kv"><span>${l}</span><b class="${cls || ''}">${v}</b></div>`;

}
function shareSum() { shareText(summaryText()); }
function cpSum() { copyText(summaryText()); }
function shareText(s) {
  if (window.SLNative && SLNative.share) { try { SLNative.share(s); return; } catch (e) { } }
  if (navigator.share) return navigator.share({ text: s }).catch(() => copyText(s));
  window.open('https://wa.me/?text=' + encodeURIComponent(s), '_blank');
}
function copyText(s) {
  const ok = () => toast('Copied. Paste it in WhatsApp');
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s).then(ok, () => fallbackCopy(s));
  fallbackCopy(s);
}
function fallbackCopy(s) { const t = document.createElement('textarea'); t.value = s; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let r = false; try { r = document.execCommand('copy'); } catch (e) { } t.remove(); toast(r ? 'Copied. Paste it in WhatsApp' : 'Could not copy on this phone'); }
function share(h, s) { ov(`<h3>${esc(h)}${X}</h3><textarea id="bt" rows="9" readonly>${esc(s)}</textarea><div class="cap"><button class="btn gh" style="flex:1" onclick="cp()">${ic('copy')}Copy</button><button class="btn" style="flex:1" onclick="cpShare()">${ic('link')}Share</button></div>`); }
function cp() { copyText($('#bt').value); }
function cpShare() { shareText($('#bt').value); }

/* ===== Add / Edit ===== */
function pc() { dd('Category', CATS.map(c => ({ k: c, l: c })), F.cat, k => { F.cat = k; render(); }); }
function pb() { dd('Paid by', act().map(k => ({ k, l: N(k), a: av(k, 26) })), F.by, k => { F.by = k; render(); }); }
function add() {
  if (!approved()) return `<div class="hd"><b>New expense</b><span class="sub">Waiting for admin approval</span></div><div class="card pad em">${ic('lock')}<br>You can add expenses once the admin accepts you.</div>`;
  const a = adm();
  if (!a || !PK[F.by]) F.by = me();
  return `<div class="hd"><b>${F.edit ? 'Edit expense' : 'New expense'}</b><span class="sub">${F.edit ? '<button class="lk" style="display:inline" onclick="cancelEdit()">Cancel edit</button>' : 'Shared equally by everyone in the room'}</span></div><div><div class="lab">Amount (${esc(V.cur || 'Rs.')})</div><input class="amt" inputmode="decimal" placeholder="0" value="${esc(F.amt)}" oninput="F.amt=this.value;pv()" autocomplete="off"></div><div><div class="lab">What was it for?</div><input placeholder="e.g. Sabzi, rashan" maxlength="40" value="${esc(F.desc)}" oninput="F.desc=this.value" autocomplete="off"></div><div class="cap"><div style="flex:1.2;min-width:0"><div class="lab">Category</div>${F.cat == 'Other' ? `<input placeholder="Type, e.g. Fuel" maxlength="24" value="${esc(F.cc)}" oninput="F.cc=this.value" autocomplete="off">` : `<button class="fld" onclick="pc()"><span>${F.cat}</span>${ic('d')}</button>`}</div><div style="flex:1;min-width:0"><div class="lab">Paid by</div><button class="fld" ${a ? 'onclick="pb()"' : ''}><span>${esc(F.by == me() ? 'Me' : S1(F.by))}</span>${a ? ic('d') : ic('lock')}</button></div></div>${F.cat == 'Other' ? '<button class="lk" style="align-self:flex-start" onclick="pc()">Change category</button>' : ''}<div class="card pad" id="pv"></div><button class="btn" onclick="saveE()">${ic('ok')}${F.edit ? 'Update' : 'Save'} expense</button>`;
}
function cancelEdit() { newF(); render(); }
function pv() {
  const e = $('#pv'); if (!e) return;
  const M = act(), a = num(F.amt) || 0, n = M.length || 1;
  e.innerHTML = `<div class="pvh"><b>Split equally between ${M.length} member${M.length == 1 ? '' : 's'}</b><span>${a ? fm(a / n) + ' each' : 'Enter an amount'}</span></div><div class="pva">${M.slice(0, 6).map(k => `<span class="pvp">${av(k, 22)}${esc(k == me() ? 'You' : S1(k))}</span>`).join('')}${M.length > 6 ? `<span class="pvp">+${M.length - 6}</span>` : ''}</div>`;
}
function saveE() {
  if (needOk()) return;
  const a = num(F.amt);
  if (!(a > 0)) return toast('Enter an amount greater than 0');
  if (a > 10000000) return toast('That amount looks too large');
  if (F.cat == 'Other' && !(F.cc || '').trim() && !F.desc.trim()) return toast('Type a category or a description');
  if (F.edit && !getE(F.edit)) { newF(); return gone(); }
  if (!act().length) return toast('There are no active members');
  if (F.edit && !_cf) return ask('Update this expense? Everyone’s share will change.', () => { _cf = 1; saveE(); _cf = 0; });
  const by = adm() && PK[F.by] ? F.by : me(), d = F.desc.trim(), cc = F.cat == 'Other' ? (F.cc || '').trim() : '', what = d || cc || F.cat, M = act();
  if (F.edit) {
    if (!adm()) return deny();
    Object.assign(getE(F.edit), { amt: a, cat: F.cat, cc, d, by });
  } else {
    const id = uid();
    D.ex.push({ id, by, amt: a, cat: F.cat, cc, d, sp: M.join(','), ts: Date.now() });
    D.nt.push({ id, by: me(), k: 'ex', p: by, a, d: what, n: M.length, tx: `${S1(by)} added ${what} · ${fm(a)} (${fm(a / M.length)} each).` });
  }
  lg(`${F.edit ? 'Updated' : 'Added'} expense: ${what} ${fm(a)}`);
  chkBud(); newF(); save(); go('ledger'); toast('Expense saved');
}

/* ===== Insights ===== */
function ins() {
  const c = calc(), T = {};
  D.ex.forEach(e => { if (counted(e)) { const k = e.cat == 'Other' && e.cc ? e.cc : e.cat; T[k] = (T[k] || 0) + e.amt; } });
  let K = Object.keys(T).sort((a, b) => T[b] - T[a]);
  if (K.length > 5) { T['More'] = K.slice(4).reduce((s, k) => s + T[k], 0); K = K.slice(0, 4).concat('More'); }
  const tot = K.reduce((s, k) => s + T[k], 0); let o = 0;
  const seg = K.map((k, i) => {
    const p = tot ? T[k] / tot * 100 : 0, gap = K.length > 1 ? Math.min(5, p * .4) : 0, d = Math.max(p - gap, .01);
    const s = p > 0 ? `<circle r="15.9" cx="18" cy="18" fill="none" stroke="${CC[i % CC.length]}" stroke-width="4" stroke-linecap="${K.length > 1 ? 'round' : 'butt'}" stroke-dasharray="${d} ${100 - d}" stroke-dashoffset="${-(o + gap / 2)}"/>` : '';
    o += p; return s;
  }).join('');
  const P = c.M.slice().sort((a, b) => c.paid[b] - c.paid[a]), mx = Math.max(1, ...P.map(k => c.paid[k]));
  const big = D.ex.filter(counted).sort((a, b) => b.amt - a.amt)[0];
  return `<div class="hd"><b>Insights</b><span class="sub">${esc(monthName())} at a glance</span></div><div class="g3"><div class="stc"><i>Room total</i><b>${fm(c.tot)}</b></div><div class="stc"><i>Each share</i><b>${fm(c.each)}</b></div><div class="stc"><i>Biggest</i><b>${big ? fm(big.amt) : '—'}</b></div></div><div class="card pad"><div class="lab">Spending by category</div>${K.length ? `<div class="dnr"><svg viewBox="0 0 36 36" width="104" height="104" role="img" aria-label="Spending by category"><circle r="15.9" cx="18" cy="18" fill="none" stroke="var(--chip)" stroke-width="4"/><g transform="rotate(-90 18 18)">${seg}</g></svg><div class="fl">${K.map((k, i) => `<div class="lg"><span class="dt" style="background:${CC[i % CC.length]}"></span><span class="ln">${esc(k)}</span><span class="sub">${fm(T[k])}</span><b>${tot ? Math.round(T[k] / tot * 100) : 0}%</b></div>`).join('')}</div></div>` : '<div class="em">No spending yet this month.</div>'}</div><div class="card pad"><div class="lab">Who paid what</div>${P.slice(0, 4).map(k => `<div class="pbr">${av(k, 22)}<span class="ln">${esc(k == me() ? 'You' : S1(k))}</span><div class="pbt"><i style="width:${Math.round(c.paid[k] / mx * 100)}%"></i></div><b>${fm(c.paid[k])}</b></div>`).join('') || '<div class="em">No members yet.</div>'}${P.length > 4 ? `<button class="lk" onclick="go('debts')">See all ${P.length} in Settle Up</button>` : ''}</div>`;
}

/* ===== Side-panel pages ===== */

function sb() {

function rst() {
  if (!adm()) return deny();

  o.dataset.lk = 1; o.style.background = 'var(--bg)'; void o.offsetWidth; o.classList.add('show');

}
function setAt(root, path, val) {
